stages: [lint, test, build, publish, deploy, verify]

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

default:
  interruptible: true

lint:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install -r requirements-dev.txt
    - ruff check .

test:
  stage: test
  image: python:3.13-slim
  script:
    - pip install -r requirements-dev.txt
    - pytest -q

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker build -t "$IMAGE_TAG" .

publish:
  stage: publish
  image: docker:27
  services: [docker:27-dind]
  needs: [build]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH'

.deploy:
  stage: deploy
  image: bitnami/kubectl:1.32
  script:
    - sed "s|IMAGE_PLACEHOLDER|$IMAGE_TAG|" k8s/deployment.yaml | kubectl apply -n "$KUBE_NAMESPACE" -f -
    - kubectl rollout status -n "$KUBE_NAMESPACE" deployment/demo-api --timeout=120s

deploy_stage:
  extends: .deploy
  variables: {KUBE_NAMESPACE: stage}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_production:
  extends: .deploy
  variables: {KUBE_NAMESPACE: production}
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG'

verify:
  stage: verify
  image: curlimages/curl:8.12.1
  script:
    - curl --fail --retry 5 "$STAGE_HEALTH_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
